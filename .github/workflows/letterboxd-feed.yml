name: Actualizar carruseles de Gustos (TMDb, Open Library, RAWG)

on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generar JSON de películas (TMDb) y libros (Open Library)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.parse, urllib.request, time

          # ---------- PELÍCULAS (TMDb) ----------
          tmdb_key = os.environ.get("TMDB_API_KEY", "")
          peliculas = []
          if tmdb_key:
              try:
                  url = f"https://api.themoviedb.org/3/list/8691519?api_key={tmdb_key}&language=es-MX"
                  data = json.load(urllib.request.urlopen(url, timeout=30))
                  for it in data.get("items", []):
                      title = it.get("title") or it.get("name") or ""
                      img = None
                      if it.get("poster_path"):
                          img = "https://image.tmdb.org/t/p/w500" + it["poster_path"]
                      peliculas.append({
                          "titulo": title,
                          "url": f"https://www.themoviedb.org/movie/{it.get('id')}",
                          "imagen": img
                      })
              except Exception as e:
                  print("Error TMDb:", e)
          with open("js/gustos.json", "w", encoding="utf-8") as f:
              json.dump(peliculas, f, ensure_ascii=False, indent=2)
          print(f"Películas: {len(peliculas)}")

          # ---------- LIBROS (Open Library) ----------
          libros = []
          try:
              with open("_data/titulos-libros.txt", encoding="utf-8") as f:
                  titulos = [l.strip() for l in f if l.strip()]
              for t in titulos:
                  q = urllib.parse.quote(t)
                  try:
                      url = f"https://openlibrary.org/search.json?q={q}&limit=1"
                      with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "myweb-gustos/1.0"}), timeout=25) as r:
                          data = json.load(r)
                      doc = (data.get("docs") or [None])[0]
                      if doc:
                          cover = doc.get("cover_i")
                          work = doc.get("key") or ""
                          img = None
                          if cover:
                              img = f"https://covers.openlibrary.org/b/id/{cover}-M.jpg"
                          libros.append({
                              "titulo": t,
                              "url": f"https://openlibrary.org{work}" if work else "",
                              "imagen": img
                          })
                  except Exception:
                      libros.append({"titulo": t, "url": "", "imagen": None})
                  time.sleep(0.3)
          except Exception as e:
              print("Error procesando libros:", e)
          with open("js/libros.json", "w", encoding="utf-8") as f:
              json.dump(libros, f, ensure_ascii=False, indent=2)
          print(f"Libros: {len(libros)}")

          # ---------- JUEGOS (RAWG) ----------
          rawg_key = os.environ.get("RAWG_API_KEY", "")
          juegos = []
          if rawg_key:
              try:
                  with open("_data/titulos-juegos.txt", encoding="utf-8") as f:
                      titulos = [l.strip() for l in f if l.strip()]
                  for t in titulos:
                      q = urllib.parse.quote(t)
                      try:
                          url = f"https://api.rawg.io/api/games?key={rawg_key}&search={q}&page_size=1"
                          data = json.load(urllib.request.urlopen(url, timeout=25))
                          res = (data.get("results") or [None])[0]
                          if res:
                              juegos.append({
                                  "titulo": t,
                                  "url": res.get("slug") and f"https://rawg.io/games/{res.get('slug')}" or "",
                                  "imagen": res.get("background_image")
                              })
                      except Exception:
                          juegos.append({"titulo": t, "url": "", "imagen": None})
                      time.sleep(0.3)
              except Exception as e:
                  print("Error procesando juegos:", e)
          else:
              # Sin clave, dejar lista vacía
              print("RAWG_API_KEY no configurada, juegos vacíos")
          with open("js/juegos.json", "w", encoding="utf-8") as f:
              json.dump(juegos, f, ensure_ascii=False, indent=2)
          print(f"Juegos: {len(juegos)}")
          EOF

      - name: Commit y push de los cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Actualiza carruseles de Gustos [skip ci]"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin HEAD:${{ github.ref }}
