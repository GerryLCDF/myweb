name: Actualizar carrusel de películas (TMDb)

on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Descargar la lista WebMovie de TMDb y generar el JSON
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request

          KEY = os.environ["TMDB_API_KEY"]
          LIST_ID = 8691519   # lista "WebMovie"
          OUT_FILE = "js/gustos.json"

          url = f"https://api.themoviedb.org/3/list/{LIST_ID}?api_key={KEY}&language=es-MX"
          try:
              with urllib.request.urlopen(url, timeout=30) as resp:
                  data = json.load(resp)
          except Exception as e:
              print("Error consultando TMDb:", e)
              data = {"items": []}

          peliculas = []
          for it in data.get("items", []):
              title = it.get("title") or it.get("name") or it.get("original_title") or ""
              img = None
              if it.get("poster_path"):
                  img = "https://image.tmdb.org/t/p/w500" + it["poster_path"]
              peliculas.append({
                  "titulo": title,
                  "url": f"https://www.themoviedb.org/movie/{it.get('id')}",
                  "imagen": img
              })

          with open(OUT_FILE, "w", encoding="utf-8") as f:
              json.dump(peliculas, f, ensure_ascii=False, indent=2)
          print(f"Películas en carrusel: {len(peliculas)}")
          EOF

      - name: Commit y push de los cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Actualiza carrusel de películas desde TMDb [skip ci]"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin HEAD:${{ github.ref }}
